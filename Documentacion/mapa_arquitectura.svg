<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <!-- Definitions for markers and filters -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.2"/>
    </filter>
    <style>
      .node { fill: #ffffff; stroke: #333; stroke-width: 2; filter: url(#shadow); }
      .node-header { font-family: Arial, sans-serif; font-weight: bold; font-size: 16px; fill: #333; }
      .node-text { font-family: Arial, sans-serif; font-size: 12px; fill: #555; }
      .node-path { font-family: Consolas, monospace; font-size: 10px; fill: #777; }
      .edge { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .edge-label { font-family: Arial, sans-serif; font-size: 11px; fill: #333; background-color: white; }
      .group-box { fill: #f9f9f9; stroke: #ddd; stroke-width: 2; rx: 10; ry: 10; }
      .group-label { font-family: Arial, sans-serif; font-weight: bold; font-size: 18px; fill: #888; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f0f4f8"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333">Arquitectura Generador COBOL IA</text>

  <!-- Groups -->
  <!-- Core System Group -->
  <rect x="350" y="80" width="500" height="650" class="group-box"/>
  <text x="370" y="110" class="group-label">Core System</text>

  <!-- Nodes -->

  <!-- User Node -->
  <g transform="translate(50, 350)">
    <circle cx="50" cy="50" r="40" class="node" style="fill: #e3f2fd;"/>
    <text x="50" y="55" text-anchor="middle" class="node-header">Usuario</text>
  </g>

  <!-- CLI Node -->
  <g transform="translate(200, 350)">
    <rect x="0" y="0" width="120" height="100" rx="5" ry="5" class="node" style="fill: #fff3e0;"/>
    <text x="60" y="30" text-anchor="middle" class="node-header">CLI Interface</text>
    <text x="60" y="50" text-anchor="middle" class="node-text">Entrada/Salida</text>
    <text x="60" y="80" text-anchor="middle" class="node-path">run_prototype.py</text>
  </g>

  <!-- Orchestrator Node -->
  <g transform="translate(500, 350)">
    <rect x="0" y="0" width="200" height="100" rx="5" ry="5" class="node" style="fill: #e8f5e9;"/>
    <text x="100" y="30" text-anchor="middle" class="node-header">Orquestador (Graph)</text>
    <text x="100" y="50" text-anchor="middle" class="node-text">LangGraph State Machine</text>
    <text x="100" y="80" text-anchor="middle" class="node-path">core/graph.py</text>
  </g>

  <!-- Planner Node -->
  <g transform="translate(500, 150)">
    <rect x="0" y="0" width="200" height="100" rx="5" ry="5" class="node" style="fill: #f3e5f5;"/>
    <text x="100" y="30" text-anchor="middle" class="node-header">Agente Planificador</text>
    <text x="100" y="50" text-anchor="middle" class="node-text">Genera Plan Técnico</text>
    <text x="100" y="80" text-anchor="middle" class="node-path">agents/planner.py</text>
  </g>

  <!-- Coder Node -->
  <g transform="translate(500, 550)">
    <rect x="0" y="0" width="200" height="100" rx="5" ry="5" class="node" style="fill: #e1f5fe;"/>
    <text x="100" y="30" text-anchor="middle" class="node-header">Agente Codificador</text>
    <text x="100" y="50" text-anchor="middle" class="node-text">Genera Código COBOL</text>
    <text x="100" y="80" text-anchor="middle" class="node-path">agents/coder.py</text>
  </g>

  <!-- Validator Node -->
  <g transform="translate(800, 350)">
    <rect x="0" y="0" width="180" height="100" rx="5" ry="5" class="node" style="fill: #ffebee;"/>
    <text x="90" y="30" text-anchor="middle" class="node-header">Validador</text>
    <text x="90" y="50" text-anchor="middle" class="node-text">Verifica Estructura</text>
    <text x="90" y="80" text-anchor="middle" class="node-path">validators/mock_validator.py</text>
  </g>

  <!-- LLM Node -->
  <g transform="translate(950, 150)">
    <ellipse cx="100" cy="50" rx="80" ry="50" class="node" style="fill: #e0f7fa; stroke-dasharray: 5,5;"/>
    <text x="100" y="45" text-anchor="middle" class="node-header">LLM (Gemini)</text>
    <text x="100" y="65" text-anchor="middle" class="node-text">Google AI Studio</text>
  </g>

  <!-- Edges -->

  <!-- User -> CLI -->
  <path d="M 140 400 L 200 400" class="edge"/>
  <text x="170" y="390" text-anchor="middle" class="edge-label">Solicitud</text>

  <!-- CLI -> Orchestrator -->
  <path d="M 320 400 L 500 400" class="edge"/>
  <text x="410" y="390" text-anchor="middle" class="edge-label">Inicia Proceso</text>

  <!-- Orchestrator -> Planner -->
  <path d="M 600 350 L 600 250" class="edge"/>
  <text x="610" y="300" text-anchor="start" class="edge-label">1. Solicita Plan</text>

  <!-- Planner -> LLM -->
  <path d="M 700 200 L 970 200" class="edge"/>
  <text x="835" y="190" text-anchor="middle" class="edge-label">Prompt Planificación</text>

  <!-- LLM -> Planner (Implicit return) -->
  
  <!-- Planner -> Orchestrator (Return) -->
  <!-- (Represented by the bidirectional nature of the flow conceptually, but simpler to just show flow out) -->

  <!-- Orchestrator -> Coder -->
  <path d="M 600 450 L 600 550" class="edge"/>
  <text x="610" y="500" text-anchor="start" class="edge-label">2. Envía Plan</text>

  <!-- Coder -> LLM -->
  <path d="M 700 600 L 1050 600 L 1050 250" class="edge"/>
  <text x="875" y="615" text-anchor="middle" class="edge-label">Prompt Codificación</text>

  <!-- Coder -> Orchestrator (Return) -->

  <!-- Orchestrator -> Validator -->
  <path d="M 700 400 L 800 400" class="edge"/>
  <text x="750" y="390" text-anchor="middle" class="edge-label">3. Valida Código</text>

  <!-- Validator -> Orchestrator (Return Loop) -->
  <path d="M 890 450 Q 890 500 750 500 Q 700 500 700 450" class="edge" style="stroke-dasharray: 5,5;"/>
  <text x="800" y="490" text-anchor="middle" class="edge-label">Resultado / Retry</text>

  <!-- Orchestrator -> CLI (Final) -->
  <path d="M 500 420 L 320 420" class="edge" style="stroke-dasharray: 5,5;"/>
  <text x="410" y="435" text-anchor="middle" class="edge-label">Resultado Final</text>

  <!-- Legend -->
  <g transform="translate(50, 650)">
    <rect x="0" y="0" width="200" height="120" fill="white" stroke="#ccc" rx="5"/>
    <text x="10" y="20" font-weight="bold" font-family="Arial" font-size="14">Leyenda</text>
    
    <rect x="10" y="35" width="20" height="10" fill="#e3f2fd" stroke="#333"/>
    <text x="40" y="45" font-family="Arial" font-size="12">Actor</text>

    <rect x="10" y="55" width="20" height="10" fill="#fff3e0" stroke="#333"/>
    <text x="40" y="65" font-family="Arial" font-size="12">Interfaz</text>

    <rect x="10" y="75" width="20" height="10" fill="#e8f5e9" stroke="#333"/>
    <text x="40" y="85" font-family="Arial" font-size="12">Lógica Core</text>

    <rect x="10" y="95" width="20" height="10" fill="#f3e5f5" stroke="#333"/>
    <text x="40" y="105" font-family="Arial" font-size="12">Agentes AI</text>
  </g>

</svg>
